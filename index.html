
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase - Online Shopping</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <header>
        <div class="logo">Shop<span>Ease</span></div>

        <nav>
            <a href="#home">Home</a>
            <a href="#products">Products</a>
            <a href="#categories">Categories</a>
        </nav>

        <div class="nav-actions">
            <input type="text" id="searchInput"
                   placeholder="Search products...">
            <button class="cart-btn" onclick="toggleCart()">
                🛒 Cart (<span id="cartCount">0</span>)
            </button>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero" id="home">
        <div>
            <h1>Discover Your Favorite Products</h1>
            <p>Great products. Amazing prices. Happy shopping.</p>
            <a href="#products" class="shop-btn">Shop Now</a>
        </div>
    </section>

    <!-- Categories -->
    <section id="categories" class="categories">
        <h2>Shop by Category</h2>
        <div class="category-buttons">
            <button onclick="filterCategory('All')">All</button>
            <button onclick="filterCategory('Electronics')">Electronics</button>
            <button onclick="filterCategory('Fashion')">Fashion</button>
            <button onclick="filterCategory('Home')">Home</button>
            <button onclick="filterCategory('Accessories')">Accessories</button>
        </div>
    </section>

    <!-- Products -->
    <section class="products-section" id="products">
        <h2>Our Products</h2>
        <div class="product-grid" id="productGrid"></div>
    </section>

    <!-- Cart -->
    <div class="cart-overlay" id="cartOverlay"
         onclick="toggleCart()"></div>

    <aside class="cart-panel" id="cartPanel">
        <div class="cart-header">
            <h2>Shopping Cart</h2>
            <button onclick="toggleCart()">✕</button>
        </div>

        <div id="cartItems"></div>

        <div class="cart-footer">
            <h3>Total: ₹<span id="cartTotal">0</span></h3>
            <button class="checkout-btn" onclick="checkout()">
                Proceed to Checkout
            </button>
        </div>
    </aside>

    <!-- Footer -->
    <footer>
        <h2>ShopEase</h2>
        <p>Your favorite online shopping destination.</p>
        <p>© 2026 ShopEase. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
